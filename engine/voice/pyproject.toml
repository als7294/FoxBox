[project]
name = "fvwks-voice"
version = "0.1.0"
description = "The stem splitter (HT-Demucs on MLX) and its model catalog (FoxBox 2.0)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fvwks-contracts",
  "numpy>=1.26",
  # HT-Demucs on MLX (stems/): the array runtime and the pinned model's download. Both came in through mlx-audio
  # before 2.0; listed directly now that the TTS stack is gone.
  "mlx>=0.32,<0.33",
  "huggingface-hub>=1.33,<2",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
