[project]
name = "fvwks-fx"
version = "0.2.0"
description = "Song analysis for FoxBox 2.0: tempo, key, structure and stem features (owned by S2)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fvwks-contracts",
  "numpy>=1.26",
  "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
