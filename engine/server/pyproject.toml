[project]
name = "fvwks-server"
version = "0.1.0"
description = "Engine HTTP server for FoxBox 2.0 REMIX: songs, stems, jobs, models, library and caches (owned by S3)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fvwks-contracts",
  "fvwks-voice",
  "fvwks-fx",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "soundfile>=0.12",
  "cryptography>=45",  # ed25519 verification of signed model-update manifests (P9)
  "mutagen>=1.47,<2",  # the library wheel's tags and artwork (GPL-2.0+); shipped in engine-code, not the runtime
]

[project.scripts]
fvwks-engine = "fvwks_server.main:main"

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
