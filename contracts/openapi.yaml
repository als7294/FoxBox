components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine code, e.g. 'not_found', 'tts_failed', 'engine_busy'.
        message:
          type: string
          title: Message
          description: Human-readable message, safe to show in the UI.
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
          description: Optional next step for the user.
        retryable:
          type: boolean
          title: Retryable
          default: false
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: 'For model_not_installed: the model to install (deep link) (v0.6, S3 P7).'
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ApiError
    Body_uploadSong:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - file
      title: Body_uploadSong
    Chord:
      properties:
        root:
          anyOf:
          - type: string
            enum:
            - C
            - C#
            - D
            - Eb
            - E
            - F
            - F#
            - G
            - Ab
            - A
            - Bb
            - B
          - type: 'null'
          title: Root
        quality:
          type: string
          enum:
          - maj
          - min
          - '5'
          - sus4
          - '7'
          - m7
          - N
          title: Quality
          default: N
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          description: The analysis's confidence; 1.0 for a chord you set or a progression BUILD chose.
          default: 1.0
        root2:
          anyOf:
          - type: string
            enum:
            - C
            - C#
            - D
            - Eb
            - E
            - F
            - F#
            - G
            - Ab
            - A
            - Bb
            - B
          - type: 'null'
          title: Root2
          description: 'v0.15.1: when the bar changes chord halfway (a turnaround or a tension half-bar), the second half''s
            root; None = one chord for the whole bar.'
        quality2:
          anyOf:
          - type: string
            enum:
            - maj
            - min
            - '5'
            - sus4
            - '7'
            - m7
            - N
          - type: 'null'
          title: Quality2
          description: 'v0.15.1: the second half''s quality, with root2.'
      additionalProperties: false
      type: object
      title: Chord
      description: 'A bar''s chord (v0.14): the harmony REMIX''s engine voices follow (basses, growls and the 808 on its root,
        a grid''s ''3''

        as its third). Spelled as FoxBox spells keys. v0.15.1: ''5'' is a power chord (root and fifth): voices play no third
        on it. No chord (drums only, silence) is quality ''N'' with root None; a None root

        always means no chord.'
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorEnvelope
      description: Body of every non-2xx response.
    Health:
      properties:
        state:
          type: string
          enum:
          - starting
          - loading_model
          - ready
          - error
          title: State
        version:
          type: string
          title: Version
        progress:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Progress
          description: While loading_model.
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        voice_engine:
          type: string
          title: Voice Engine
          description: e.g. 'stub', 'kokoro-mlx'.
        fx_engine:
          type: string
          title: Fx Engine
          description: e.g. 'stub', 'fvwks-rack'.
        disk_free_bytes:
          type: integer
          title: Disk Free Bytes
        data_dir:
          type: string
          title: Data Dir
        export_dir:
          type: string
          title: Export Dir
        required_missing:
          items:
            type: string
          type: array
          title: Required Missing
          description: Required model ids not installed yet; the installer/first-run screen fetches them (v0.4).
      additionalProperties: false
      type: object
      required:
      - state
      - version
      - voice_engine
      - fx_engine
      - disk_free_bytes
      - data_dir
      - export_dir
      title: Health
    Job:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
          - model_install
          - batch
          - analysis
          - persona_design
          - song_analysis
          - song_stems
          - song_lyrics
          - remix_build
          - remix_prepare
          - remix_export
          - rekordbox_import
          - sample_scan
          - take_loudness
          title: Kind
        state:
          type: string
          enum:
          - queued
          - running
          - done
          - error
          - cancelled
          title: State
        progress:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Progress
          default: 0.0
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        items:
          items:
            $ref: '#/components/schemas/JobItem'
          type: array
          title: Items
        result_ids:
          items:
            type: string
          type: array
          title: Result Ids
          description: 'batch: export ids (+ rekordbox xml path in message); persona_design: candidate ids.'
        error:
          anyOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        bytes_done:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bytes Done
          description: Download/installer progress in bytes (v0.4).
        bytes_total:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bytes Total
          description: Total bytes for this job, when known (v0.4).
        rate_bps:
          anyOf:
          - type: number
          - type: 'null'
          title: Rate Bps
          description: Current transfer rate, bytes per second (v0.4).
        eta_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Eta S
          description: Estimated seconds remaining (v0.4).
        current_item:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Item
          description: What is being fetched right now, e.g. a model file or component name (v0.4).
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - state
      - created_at
      - updated_at
      title: Job
    JobItem:
      properties:
        index:
          type: integer
          title: Index
        label:
          type: string
          title: Label
        state:
          type: string
          enum:
          - queued
          - running
          - done
          - error
          - cancelled
          title: State
        progress:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Progress
          default: 0.0
        error:
          anyOf:
          - $ref: '#/components/schemas/ApiError'
          - type: 'null'
        result_ids:
          items:
            type: string
          type: array
          title: Result Ids
          description: e.g. take/export ids produced by this item.
      additionalProperties: false
      type: object
      required:
      - index
      - label
      - state
      title: JobItem
    LibraryPlaylist:
      properties:
        id:
          type: string
          title: Id
        source_id:
          type: string
          title: Source Id
        name:
          type: string
          title: Name
        parent_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Parent Id
        kind:
          type: string
          enum:
          - folder
          - playlist
          - crate
          title: Kind
        track_count:
          type: integer
          title: Track Count
      additionalProperties: false
      type: object
      required:
      - id
      - source_id
      - name
      - kind
      - track_count
      title: LibraryPlaylist
      description: 'A playlist, crate or folder of a library (v1.1): flat, nested by parent_id. A folder lists everything
        under it.'
    LibrarySource:
      properties:
        id:
          type: string
          title: Id
        kind:
          type: string
          enum:
          - folder
          - rekordbox
          - serato
          title: Kind
        name:
          type: string
          title: Name
          description: e.g. 'Music' (a folder's name), 'Rekordbox', 'Serato · USB DRIVE'.
        state:
          type: string
          enum:
          - scanning
          - ready
          - error
          title: State
          description: 'scanning: its first scan (later rescans keep serving the last index).'
        tracks:
          type: integer
          title: Tracks
          default: 0
        playlists:
          type: integer
          title: Playlists
          default: 0
        scanned_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Scanned At
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
          description: Why it's in error, or a note (e.g. which Serato library was read).
        created_at:
          type: string
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - name
      - state
      - created_at
      title: LibrarySource
      description: 'A library the wheel browses (v1.1). Where it lives never leaves the engine: `name` is for display only.'
    LibrarySourceAdd:
      properties:
        kind:
          type: string
          enum:
          - folder
          - rekordbox
          - serato
          title: Kind
        path:
          type: string
          maxLength: 4096
          minLength: 1
          title: Path
      additionalProperties: false
      type: object
      required:
      - kind
      - path
      title: LibrarySourceAdd
      description: 'POST /api/library/sources (v1.1), from main only (header X-FoxBox-Main): a music folder, a rekordbox.xml
        export

        or a _Serato_ folder the user picked in main''s native dialog. The renderer never sends paths.'
    LibraryTrack:
      properties:
        id:
          type: string
          title: Id
        source_id:
          type: string
          title: Source Id
        title:
          type: string
          title: Title
          description: Its title tag, else the file name without its extension.
        artist:
          anyOf:
          - type: string
          - type: 'null'
          title: Artist
        album:
          anyOf:
          - type: string
          - type: 'null'
          title: Album
        genre:
          anyOf:
          - type: string
          - type: 'null'
          title: Genre
        bpm:
          anyOf:
          - type: number
          - type: 'null'
          title: Bpm
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: e.g. 'Am', 'F#' (the source's spelling when it isn't one we read).
        camelot:
          anyOf:
          - type: string
          - type: 'null'
          title: Camelot
        duration_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Duration S
        file_name:
          type: string
          title: File Name
          description: The file's name only (never its path).
        format:
          type: string
          title: Format
          description: Its extension, e.g. 'mp3', 'm4a', 'flac'.
        missing:
          type: boolean
          title: Missing
          description: Its file isn't there (moved, or its drive is unplugged).
          default: false
        has_art:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Art
          description: None until known (GET .../art says).
        added_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Added At
      additionalProperties: false
      type: object
      required:
      - id
      - source_id
      - title
      - file_name
      - format
      title: LibraryTrack
      description: A track in a library (v1.1). Its file stays where it is; it's addressed by id (art, preview, load as a
        song).
    LibraryTrackPage:
      properties:
        total:
          type: integer
          title: Total
        offset:
          type: integer
          title: Offset
        items:
          items:
            $ref: '#/components/schemas/LibraryTrack'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - total
      - offset
      - items
      title: LibraryTrackPage
      description: 'GET /api/library/tracks (v1.1): one page of tracks.'
    ManifestModel:
      properties:
        version:
          type: string
          title: Version
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
        repos:
          items:
            $ref: '#/components/schemas/ManifestRepo'
          type: array
          title: Repos
      additionalProperties: false
      type: object
      required:
