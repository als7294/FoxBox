      additionalProperties: false
      type: object
      title: Master
    ModelInfo:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        engine:
          type: string
          title: Engine
        size_bytes:
          type: integer
          title: Size Bytes
        installed:
          type: boolean
          title: Installed
        required:
          type: boolean
          title: Required
          description: Required models ship by default; others are opt-in downloads.
        license:
          type: string
          title: License
        description:
          type: string
          title: Description
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
          description: Latest available version of this model package (v0.4).
        installed_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Installed Version
          description: Installed version, if any (v0.4).
        update_available:
          type: boolean
          title: Update Available
          description: installed_version is older than version (v0.4).
          default: false
        default_selected:
          type: boolean
          title: Default Selected
          description: Installer pre-ticks this optional model (v0.4).
          default: false
        install_job_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Install Job Id
          description: Running install job for this model, so UIs can reattach after a reload (v0.5, S3 P6).
        install_needs_bytes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Install Needs Bytes
          description: Remaining download + the disk reserve needed to install (v0.5, S3 P6).
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - engine
      - size_bytes
      - installed
      - required
      - license
      - description
      title: ModelInfo
    ModelManifest:
      properties:
        schema_version:
          type: integer
          title: Schema Version
          default: 1
        published:
          type: string
          title: Published
        models:
          additionalProperties:
            $ref: '#/components/schemas/ManifestModel'
          type: object
          title: Models
      additionalProperties: false
      type: object
      required:
      - published
      - models
      title: ModelManifest
      description: Model-update manifest published with app releases (v0.6, S3 P9). Only same-file-name/same-license pin moves.
    Peaks:
      properties:
        buckets:
          type: integer
          title: Buckets
        duration_s:
          type: number
          title: Duration S
        min:
          items:
            type: number
          type: array
          title: Min
        max:
          items:
            type: number
          type: array
          title: Max
      additionalProperties: false
      type: object
      required:
      - buckets
      - duration_s
      - min
      - max
      title: Peaks
      description: 'Waveform overview: `buckets` min/max pairs of the channel-summed signal, normalized to [-1, 1].'
    RekordboxSettings:
      properties:
        hot_cue_first_word:
          type: boolean
          title: Hot Cue First Word
          default: true
        memory_cue_tail:
          type: boolean
          title: Memory Cue Tail
          default: true
        target_path_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Path Root
        playlist_default:
          type: string
          title: Playlist Default
          default: GUY FVWKS — Drops
      additionalProperties: false
      type: object
      title: RekordboxSettings
    Settings:
      properties:
        export_dir:
          type: string
          title: Export Dir
        format:
          type: string
          enum:
          - aiff
          - wav
          title: Format
          default: aiff
        bit_depth:
          type: integer
          enum:
          - 16
          - 24
          title: Bit Depth
          default: 24
        master:
          $ref: '#/components/schemas/Master'
        filename_pattern:
          type: string
          title: Filename Pattern
          default: '{slug}_{preset}_{bpm}bpm_{bars}bar_{key}_{variant}_v{version:02d}'
        artist:
          type: string
          title: Artist
          default: GUY FVWKS
        rekordbox:
          $ref: '#/components/schemas/RekordboxSettings'
        default_voice_id:
          type: string
          title: Default Voice Id
          default: kokoro:am_fenrir
        default_preset_id:
          type: string
          title: Default Preset Id
          default: pact
        default_bpm:
          type: number
          maximum: 200.0
          minimum: 60.0
          title: Default Bpm
          default: 140.0
        default_bars:
          anyOf:
          - type: integer
            enum:
            - 1
            - 2
            - 4
            - 8
            - 16
          - type: string
            const: auto
          title: Default Bars
          default: auto
        default_key:
          type: string
          title: Default Key
          default: Am
      additionalProperties: false
      type: object
      required:
      - export_dir
      title: Settings
    SignedModelManifest:
      properties:
        manifest:
          $ref: '#/components/schemas/ModelManifest'
        signature:
          type: string
          title: Signature
        key_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Id
      additionalProperties: false
      type: object
      required:
      - manifest
      - signature
      title: SignedModelManifest
      description: 'PUT /api/models/manifest body: the manifest plus a base64 ed25519 signature over its canonical JSON (v0.6).'
    Song:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        duration_s:
          type: number
          title: Duration S
        sample_rate:
          type: integer
          title: Sample Rate
        channels:
          type: integer
          title: Channels
        peaks:
          $ref: '#/components/schemas/Peaks'
        audio_id:
          type: string
          title: Audio Id
          description: Stream with GET /api/audio/{audio_id} (preview / backing track).
        analysis_state:
          type: string
          enum:
          - queued
          - running
          - done
          - error
          title: Analysis State
          default: queued
        analysis:
          anyOf:
          - $ref: '#/components/schemas/SongAnalysis'
          - type: 'null'
        bpm_override:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Bpm Override
          description: User's tempo when the detected one is wrong.
        downbeat_override_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Downbeat Override S
          description: User's bar-1 position (grid nudge).
        key_override:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Override
        created_at:
          type: string
          title: Created At
        stems_state:
          type: string
          enum:
          - none
          - queued
          - running
          - done
          - error
          title: Stems State
          description: 'v0.9: stem separation, started with POST /api/songs/{id}/stems.'
          default: none
        stems:
          items:
            $ref: '#/components/schemas/SongStem'
          type: array
          title: Stems
          description: 'v0.9: the separated stems once stems_state is ''done''.'
        structure:
          anyOf:
          - $ref: '#/components/schemas/SongStructure'
          - type: 'null'
          description: 'v0.10: sections, drops and phrases (after analysis; refined after stems).'
        lyrics_state:
          type: string
          enum:
          - none
          - queued
          - running
          - done
          - error
          title: Lyrics State
          description: 'v0.10: lyrics transcription, started with POST /api/songs/{id}/lyrics.'
          default: none
        cues:
          items:
            $ref: '#/components/schemas/SongCue'
          type: array
          title: Cues
          description: 'v0.12: cues imported from Rekordbox.'
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - duration_s
      - sample_rate
      - channels
      - peaks
      - audio_id
      - created_at
      title: Song
      description: A track the user imported to put drops over (v0.7). Songs are local-only; they never leave the Mac.
    SongAnalysis:
      properties:
        bpm:
          type: number
          exclusiveMinimum: 0.0
          title: Bpm
        bpm_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Bpm Confidence
          default: 0.0
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: e.g. 'Am', 'F#'; None when the key is unclear.
        camelot:
          anyOf:
          - type: string
          - type: 'null'
          title: Camelot
          description: e.g. '8A'.
        key_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Key Confidence
          default: 0.0
        downbeat_s:
          type: number
          minimum: 0.0
          title: Downbeat S
          description: 'Time of bar 1, beat 1: the grid anchor.'
          default: 0.0
        beats_per_bar:
          type: integer
          minimum: 1.0
          title: Beats Per Bar
          default: 4
        source:
          type: string
          enum:
          - foxbox
          - rekordbox
          title: Source
          description: 'v0.12: ''rekordbox'' when the grid and key came from a Rekordbox import.'
          default: foxbox
        tuning_cents:
          anyOf:
          - type: number
            exclusiveMaximum: 50.0
            minimum: -50.0
          - type: 'null'
          title: Tuning Cents
          description: 'v0.15.1: the source''s tuning against A=440 in cents (a 432 Hz track is -31.8); every REMIX voice,
            repitched one-shot, kick and snare is tuned by it. None until measured.'
      additionalProperties: false
      type: object
      required:
      - bpm
      title: SongAnalysis
      description: Tempo, key and grid of an imported song (v0.7). Produced by the sound engine (FxAPI.analyze_song).
    SongCue:
      properties:
        name:
          type: string
          title: Name
          default: ''
        kind:
          type: string
          enum:
          - hot
          - memory
          - loop
          title: Kind
        start_s:
          type: number
          minimum: 0.0
          title: Start S
        end_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: End S
          description: Loops only.
        num:
          anyOf:
          - type: integer
            maximum: 7.0
            minimum: 0.0
          - type: 'null'
          title: Num
          description: Hot-cue slot A-H as 0-7.
        color:
          anyOf:
          - type: string
            pattern: ^#[0-9A-Fa-f]{6}$
          - type: 'null'
          title: Color
      additionalProperties: false
      type: object
      required:
      - kind
      - start_s
      title: SongCue
      description: 'A cue from Rekordbox (v0.12): POSITION_MARK Type 0 (cue) / 4 (loop); Num -1 is a memory cue, 0-7 a hot
        cue.'
    SongSection:
      properties:
        kind:
          type: string
          enum:
          - intro
          - verse
          - build
          - drop
          - breakdown
          - outro
          title: Kind
        start_s:
          type: number
          minimum: 0.0
          title: Start S
        end_s:
          type: number
          minimum: 0.0
          title: End S
        start_bar:
          type: integer
          minimum: 1.0
          title: Start Bar
          description: Song bar (1-based, on the song's grid) where the section starts.
        energy:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Energy
          description: Mean loudness/density of the section, normalised per song.
        bass_style:
          anyOf:
          - type: string
            enum:
            - deep
            - trap
            - dubstep
            - other
          - type: 'null'
          title: Bass Style
          description: v0.10.1; None without bass.
        half_time:
          type: boolean
          title: Half Time
          description: 'v0.10.1: snare on beat 3 only (a 70 feel at 140).'
          default: false
        note_beats:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Note Beats
          description: 'v0.10.1: median bass-note length in beats.'
        wobble_div:
          anyOf:
          - type: string
          - type: 'null'
          title: Wobble Div
          description: 'v0.10.1: dominant bass LFO as a beat division, e.g. ''1/8'', ''1/8T'', ''1/16''.'
        wobble_anchor_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Wobble Anchor S
          description: 'v0.10.1: an LFO peak in song time; phase = frac((t - anchor) / period).'
      additionalProperties: false
      type: object
      required:
      - kind
      - start_s
      - end_s
      - start_bar
      - energy
      title: SongSection
      description: One part of a song on its own grid (v0.10). Sections tile the song in order, without gaps or overlaps.
    SongStem:
      properties:
        name:
          type: string
          enum:
          - drums
          - bass
          - vocals
          - other
          title: Name
        audio_id:
          type: string
          title: Audio Id
          description: Stream with GET /api/audio/{audio_id}.
      additionalProperties: false
      type: object
      required:
      - name
      - audio_id
      title: SongStem
      description: One separated stem of a song (v0.9). Stems are local-only, like songs.
    SongStructure:
      properties:
        sections:
          items:
            $ref: '#/components/schemas/SongSection'
          type: array
          title: Sections
        drops_s:
          items:
            type: number
          type: array
          title: Drops S
        builds:
          items:
            prefixItems:
            - type: number
            - type: number
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Builds
          description: (build start s, drop hit s) pairs.
        phrase_bars:
          type: integer
          minimum: 1.0
          title: Phrase Bars
          default: 8
        energy_fps:
          type: number
          exclusiveMinimum: 0.0
          title: Energy Fps
          default: 10.0
        energy_b64:
          type: string
          title: Energy B64
          description: base64 of uint8, one value per frame at energy_fps.
          default: ''
        from_stems:
          type: boolean
          title: From Stems
          description: True once refined with stems (drums/bass entries).
          default: false
        chords:
          items:
            $ref: '#/components/schemas/Chord'
          type: array
          title: Chords
          description: 'v0.14: one chord per song bar from bar 1 (the downbeat), in order, read from the stems; empty until
            stems exist.'
      additionalProperties: false
      type: object
      required:
      - sections
      title: SongStructure
      description: 'Where a song builds, drops and breathes (v0.10), for the AUTO-VJ director and pre-drop text.


        `drops_s` are the drop hits (the first beat of each drop section) in song time. `builds` pairs each build''s start

        with the drop it leads into. `phrase_bars` is the phrase length the sections snap to (8 or 16).

        `energy` is a coarse loudness/density curve at `energy_fps` over the whole song, 0-255, normalised per song.'
    SongUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
            minLength: 1
          - type: 'null'
          title: Name
        bpm_override:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Bpm Override
        downbeat_override_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Downbeat Override S
        key_override:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Override
      additionalProperties: false
      type: object
      title: SongUpdate
      description: PATCH body. Only the fields present are applied; an explicit null clears an override.
    StemFeatures:
      properties:
        song_id:
          type: string
          title: Song Id
        fps:
          type: number
          exclusiveMinimum: 0.0
          title: Fps
          default: 60.0
        frames:
          type: integer
          minimum: 0.0
          title: Frames
        tracks:
          items:
            type: string
            enum:
            - drums
            - bass
            - vocals
            - other
            - mix
          type: array
          title: Tracks
        data_b64:
          type: string
          title: Data B64
        bass_b64:
          type: string
          title: Bass B64
          description: 'v0.10.1: bass-line intelligence at the same fps, base64 of uint8, 4 bytes per frame: [0] flags (bit0
            bass note on, bit1 note onset this frame); [1] sub weight < 60 Hz, 0-255 normalised per song; [2] growl weight
            100-600 Hz, 0-255 normalised per song; [3] sub f0 as MIDI x 2 (0 = none). Empty when not computed.'
          default: ''
      additionalProperties: false
      type: object
      required:
      - song_id
      - frames
      - tracks
      - data_b64
      title: StemFeatures
      description: "Per-stem reactive features of a whole song for the visuals (v0.9): GET /api/songs/{id}/stems/features.\n\
        \nSampled at `fps` over the whole song; frame f covers song time f / fps seconds.\n`data_b64` is base64 of uint8,\
        \ frame-major: for each frame, for each entry of `tracks` in order, two bytes (rms, onset):\n- rms: that track's envelope,\
        \ 0-255 for 0-1, normalised per song (the track's loudest moment is 255).\n- onset: 0 when there's no hit; otherwise\
        \ strength / threshold * 64, clamped to 255 (>= 64 is a hit, matching\n  AudioFrame onset >= 1).\n`tracks` is the\
        \ four stems in STEM_NAMES order, then \"mix\" (the whole song), so offline clip renders never need\nreal-time analysis."
