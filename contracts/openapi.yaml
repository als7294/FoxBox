      description: 'PUT /api/models/manifest body: the manifest plus a base64 ed25519 signature over its canonical JSON (v0.6).'
    Song:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        duration_s:
          type: number
          title: Duration S
        sample_rate:
          type: integer
          title: Sample Rate
        channels:
          type: integer
          title: Channels
        peaks:
          $ref: '#/components/schemas/Peaks'
        audio_id:
          type: string
          title: Audio Id
          description: Stream with GET /api/audio/{audio_id} (preview / backing track).
        analysis_state:
          type: string
          enum:
          - queued
          - running
          - done
          - error
          title: Analysis State
          default: queued
        analysis:
          anyOf:
          - $ref: '#/components/schemas/SongAnalysis'
          - type: 'null'
        bpm_override:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: 'null'
