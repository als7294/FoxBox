components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine code, e.g. 'not_found', 'tts_failed', 'engine_busy'.
        message:
          type: string
          title: Message
          description: Human-readable message, safe to show in the UI.
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
          description: Optional next step for the user.
        retryable:
          type: boolean
          title: Retryable
          default: false
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: 'For model_not_installed: the model to install (deep link) (v0.6, S3 P7).'
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ApiError
    Arrange:
      properties:
        bpm:
          type: number
          maximum: 200.0
          minimum: 60.0
          title: Bpm
          default: 140.0
        bars:
          anyOf:
          - type: integer
            enum:
            - 1
            - 2
            - 4
            - 8
            - 16
          - type: string
            const: auto
          - type: 'null'
          title: Bars
          description: '''auto'' (default) = the standard bar count (1/2/4/8/16) nearest to the phrase''s natural length that
            it fits, padding or compressing by at most max_stretch (fvwks_contracts.audio.resolve_auto_bars). None = FREE
            (no grid fit). RenderInfo.bars reports the resolved count.'
          default: auto
        key:
          type: string
          title: Key
          description: Root + optional 'm', e.g. 'Am', 'F#m', 'C'. Drives monotone and vocoder notes.
          default: Am
        fit:
          type: string
          enum:
          - auto
          - pad
          - stretch
          title: Fit
          description: 'auto (v0.4): warp to the grid per snap_end, pad the rest with the tail; if even max_stretch can''t
            fit, grow to the next bar count (FitReport.status ''extended''), never cut. pad: no time manipulation. stretch:
            always stretch to fill.'
          default: auto
        max_stretch:
          type: number
          maximum: 0.25
          minimum: 0.0
          title: Max Stretch
          default: 0.08
        beat_lock:
          type: boolean
          title: Beat Lock
          default: false
        first_word_beat:
          type: number
          minimum: 0.0
          title: First Word Beat
          description: Where the first word lands, in beats from the file start (room for swells/pre-roll).
          default: 0.0
        tail_beats:
          type: number
          minimum: 0.0
          title: Tail Beats
          description: Ring-out reserved at the end, inside the N bars.
          default: 0.0
        snap_end:
          type: string
          enum:
          - 'off'
          - beat
          - bar
          title: Snap End
          description: 'v0.4.1: time-manipulate the phrase so its first word starts on the downbeat and its LAST word ends
            exactly on a beat (''beat'') or bar line (''bar''), stretching/squeezing within max_stretch (R3), then let the
            tail ring; ''off'' = natural length. Speech is never truncated.'
          default: beat
        auto_tail:
          type: boolean
          title: Auto Tail
          description: Reserve room after the last word for its natural release and the chain's FX tail (reverb/delay/throws)
            when fitting; speech is never truncated (v0.4).
          default: true
        fade_in_ms:
          type: number
          minimum: 0.0
          title: Fade In Ms
          default: 2.0
        fade_out_ms:
          type: number
          minimum: 0.0
          title: Fade Out Ms
          default: 30.0
      additionalProperties: false
      type: object
      title: Arrange
    BatchExportOptions:
      properties:
        format:
          type: string
          enum:
          - aiff
          - wav
          title: Format
          default: aiff
        bit_depth:
          type: integer
          enum:
          - 16
          - 24
          title: Bit Depth
          default: 24
        variants:
          items:
            type: string
          type: array
          title: Variants
      additionalProperties: false
      type: object
      title: BatchExportOptions
    BatchLine:
      properties:
        script:
          type: string
          maxLength: 2000
          minLength: 1
          title: Script
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        voice_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice Id
        preset_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Preset Id
        bpm:
          anyOf:
          - type: number
            maximum: 200.0
            minimum: 60.0
          - type: 'null'
          title: Bpm
        bars:
          anyOf:
          - type: integer
            enum:
            - 1
            - 2
            - 4
            - 8
            - 16
          - type: string
            const: auto
          - type: 'null'
          title: Bars
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
      additionalProperties: false
      type: object
      required:
      - script
      title: BatchLine
    BatchRequest:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/BatchLine'
          type: array
          maxItems: 200
          minItems: 1
          title: Lines
        voice_id:
          type: string
          title: Voice Id
          default: kokoro:am_fenrir
        speed:
          type: number
          maximum: 2.0
          minimum: 0.5
          title: Speed
          default: 0.9
        preset_id:
          type: string
          title: Preset Id
          default: pact
        macros:
          anyOf:
          - $ref: '#/components/schemas/Macros'
          - type: 'null'
        arrange:
          $ref: '#/components/schemas/Arrange'
        master:
          $ref: '#/components/schemas/Master'
        export:
          $ref: '#/components/schemas/BatchExportOptions'
        playlist:
          anyOf:
          - type: string
          - type: 'null'
          title: Playlist
          description: Also write rekordbox.xml with this playlist name.
      additionalProperties: false
      type: object
      required:
      - lines
      title: BatchRequest
    Body_uploadSong:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
      type: object
      required:
      - file
      title: Body_uploadSong
    Body_uploadSource:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        kind:
          type: string
          enum:
          - recording
          - import
          title: Kind
          default: import
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        denoise:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Denoise
      type: object
      required:
      - file
      title: Body_uploadSource
    Chain:
      properties:
        modules:
          items:
            $ref: '#/components/schemas/ModuleState'
          type: array
          title: Modules
          description: Modules not listed are disabled. Order is fixed by the rack.
      additionalProperties: false
      type: object
      title: Chain
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorEnvelope
      description: Body of every non-2xx response.
    ExportRequest:
      properties:
        render_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Render Ids
        format:
          type: string
          enum:
          - aiff
          - wav
          title: Format
          default: aiff
        bit_depth:
          type: integer
          enum:
          - 16
          - 24
          title: Bit Depth
          default: 24
        variants:
          items:
            type: string
          type: array
          title: Variants
          description: '''wet'' | ''dry'' | ''alt:<preset_id>'''
        stems:
          type: boolean
          title: Stems
          default: false
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        bake:
          anyOf:
          - $ref: '#/components/schemas/SongPlacement'
          - type: 'null'
          description: 'v0.7: also write the song with this drop baked in (variant ''baked''), one per render. start_bar/end_bar
            cut an excerpt; None = the whole song.'
      additionalProperties: false
      type: object
      required:
      - render_ids
      title: ExportRequest
    ExportResult:
      properties:
        files:
          items:
            $ref: '#/components/schemas/ExportedFile'
          type: array
          title: Files
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: 'e.g. ''no stems: the sound engine doesn''t produce them yet'' (v0.1).'
      additionalProperties: false
      type: object
      required:
      - files
      title: ExportResult
    ExportedFile:
      properties:
        id:
          type: string
          title: Id
        render_id:
          type: string
          title: Render Id
        variant:
          type: string
          title: Variant
          description: '''wet'' | ''dry'' | ''alt:<preset_id>'' | ''stem:<name>'' | ''baked'' (v0.7: the song with the drop
            in it)'
        title:
          type: string
          title: Title
        filename:
          type: string
          title: Filename
        path:
          type: string
          title: Path
          description: Absolute path inside the export root.
        format:
          type: string
          enum:
          - aiff
          - wav
          title: Format
        sample_rate:
          type: integer
          title: Sample Rate
        bit_depth:
          type: integer
          title: Bit Depth
        channels:
          type: integer
          title: Channels
        n_samples:
          type: integer
          title: N Samples
        duration_s:
          type: number
          title: Duration S
        bpm:
          anyOf:
          - type: number
          - type: 'null'
          title: Bpm
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        bars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Bars
        first_word_s:
          type: number
          title: First Word S
          default: 0.0
        tail_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Tail S
          description: End of the last word (rekordbox memory cue 'VOICE OUT').
        size_bytes:
          type: integer
          title: Size Bytes
        created_at:
          type: string
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - render_id
      - variant
      - title
      - filename
      - path
      - format
      - sample_rate
      - bit_depth
      - channels
      - n_samples
      - duration_s
      - size_bytes
      - created_at
      title: ExportedFile
    FitReport:
      properties:
        status:
          type: string
          enum:
          - fits
          - stretched
          - extended
          - overflow
          - free
          title: Status
          description: '''extended'' (v0.4): the phrase + tail did not fit the requested bars, so the render grew to the next
            bar count instead of cutting speech. ''overflow'' is legacy (speech is never truncated from v0.4).'
        speech_s:
          type: number
          title: Speech S
        available_s:
          type: number
          title: Available S
        total_s:
          type: number
          title: Total S
        stretch_ratio:
          type: number
          title: Stretch Ratio
          default: 1.0
        suggested_bars:
          anyOf:
          - type: integer
          - type: 'null'
          title: Suggested Bars
        message:
          type: string
          title: Message
        reserved_tail_s:
          anyOf:
          - type: number
          - type: 'null'
          title: Reserved Tail S
          description: Room kept after the last word for its release + FX tail (v0.4).
      additionalProperties: false
      type: object
      required:
      - status
      - speech_s
      - available_s
      - total_s
      - message
      title: FitReport
    Health:
      properties:
