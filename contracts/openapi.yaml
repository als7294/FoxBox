          description: User's tempo when the detected one is wrong.
        downbeat_override_s:
          anyOf:
          - type: number
            minimum: 0.0
          - type: 'null'
          title: Downbeat Override S
          description: User's bar-1 position (grid nudge).
        key_override:
          anyOf:
          - type: string
          - type: 'null'
          title: Key Override
        created_at:
          type: string
          title: Created At
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - duration_s
      - sample_rate
      - channels
      - peaks
      - audio_id
      - created_at
      title: Song
      description: A track the user imported to put drops over (v0.7). Songs are local-only; they never leave the Mac.
    SongAnalysis:
      properties:
        bpm:
          type: number
          exclusiveMinimum: 0.0
          title: Bpm
        bpm_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Bpm Confidence
          default: 0.0
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
          description: e.g. 'Am', 'F#'; None when the key is unclear.
        camelot:
          anyOf:
          - type: string
          - type: 'null'
          title: Camelot
          description: e.g. '8A'.
        key_confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Key Confidence
          default: 0.0
        downbeat_s:
          type: number
          minimum: 0.0
          title: Downbeat S
          description: 'Time of bar 1, beat 1: the grid anchor.'
          default: 0.0
        beats_per_bar:
          type: integer
          minimum: 1.0
          title: Beats Per Bar
          default: 4
      additionalProperties: false
      type: object
      required:
      - bpm
      title: SongAnalysis
      description: Tempo, key and grid of an imported song (v0.7). Produced by the sound engine (FxAPI.analyze_song).
    SongPlacement:
      properties:
        song_id:
          type: string
          title: Song Id
        at_bar:
          type: integer
          minimum: 1.0
          title: At Bar
          description: Song bar (1-based, on the song's grid) where the drop starts.
          default: 1
        duck_db:
          type: number
          maximum: 0.0
          minimum: -24.0
          title: Duck Db
          description: Song level under the drop (sidechain-style duck).
          default: -6.0
        song_gain_db:
          type: number
          maximum: 12.0
          minimum: -24.0
          title: Song Gain Db
          default: 0.0
        drop_gain_db:
          type: number
          maximum: 12.0
          minimum: -24.0
          title: Drop Gain Db
          default: 0.0
        start_bar:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Start Bar
          description: Excerpt start bar (camera clips, previews); None = song start.
        end_bar:
          anyOf:
          - type: integer
            minimum: 2.0
          - type: 'null'
          title: End Bar
          description: Excerpt end bar, exclusive; None = song end.
      additionalProperties: false
      type: object
      required:
      - song_id
      title: SongPlacement
      description: Where a drop sits in a song, and how the two are balanced (v0.7).
    SongUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 200
