          type: string
          title: Data B64
        bass_b64:
          type: string
          title: Bass B64
          description: 'v0.10.1: bass-line intelligence at the same fps, base64 of uint8, 4 bytes per frame: [0] flags (bit0
            bass note on, bit1 note onset this frame); [1] sub weight < 60 Hz, 0-255 normalised per song; [2] growl weight
            100-600 Hz, 0-255 normalised per song; [3] sub f0 as MIDI x 2 (0 = none). Empty when not computed.'
          default: ''
      additionalProperties: false
      type: object
      required:
      - song_id
      - frames
      - tracks
      - data_b64
      title: StemFeatures
      description: "Per-stem reactive features of a whole song for the visuals (v0.9): GET /api/songs/{id}/stems/features.\n\
        \nSampled at `fps` over the whole song; frame f covers song time f / fps seconds.\n`data_b64` is base64 of uint8,\
        \ frame-major: for each frame, for each entry of `tracks` in order, two bytes (rms, onset):\n- rms: that track's envelope,\
        \ 0-255 for 0-1, normalised per song (the track's loudest moment is 255).\n- onset: 0 when there's no hit; otherwise\
        \ strength / threshold * 64, clamped to 255 (>= 64 is a hit, matching\n  AudioFrame onset >= 1).\n`tracks` is the\
        \ four stems in STEM_NAMES order, then \"mix\" (the whole song), so offline clip renders never need\nreal-time analysis."
