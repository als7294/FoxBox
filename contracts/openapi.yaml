            - 16
          - type: string
            const: auto
          title: Default Bars
          default: auto
        default_key:
          type: string
          title: Default Key
          default: Am
      additionalProperties: false
      type: object
      required:
      - export_dir
      title: Settings
    SignedModelManifest:
      properties:
        manifest:
          $ref: '#/components/schemas/ModelManifest'
