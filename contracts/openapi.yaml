components:
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
          description: Stable machine code, e.g. 'not_found', 'tts_failed', 'engine_busy'.
        message:
          type: string
          title: Message
          description: Human-readable message, safe to show in the UI.
        hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Hint
          description: Optional next step for the user.
        retryable:
          type: boolean
          title: Retryable
          default: false
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: 'For model_not_installed: the model to install (deep link) (v0.6, S3 P7).'
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ApiError
    Arrange:
      properties:
        bpm:
          type: number
          maximum: 200.0
          minimum: 60.0
          title: Bpm
          default: 140.0
        bars:
          anyOf:
          - type: integer
            enum:
            - 1
            - 2
            - 4
            - 8
            - 16
          - type: string
            const: auto
          - type: 'null'
          title: Bars
          description: '''auto'' (default) = the standard bar count (1/2/4/8/16) nearest to the phrase''s natural length that
            it fits, padding or compressing by at most max_stretch (fvwks_contracts.audio.resolve_auto_bars). None = FREE
            (no grid fit). RenderInfo.bars reports the resolved count.'
          default: auto
        key:
          type: string
          title: Key
          description: Root + optional 'm', e.g. 'Am', 'F#m', 'C'. Drives monotone and vocoder notes.
          default: Am
        fit:
          type: string
          enum:
          - auto
          - pad
          - stretch
          title: Fit
          description: 'auto (v0.4): warp to the grid per snap_end, pad the rest with the tail; if even max_stretch can''t
            fit, grow to the next bar count (FitReport.status ''extended''), never cut. pad: no time manipulation. stretch:
            always stretch to fill.'
          default: auto
        max_stretch:
          type: number
          maximum: 0.25
          minimum: 0.0
          title: Max Stretch
          default: 0.08
        beat_lock:
          type: boolean
          title: Beat Lock
          default: false
        first_word_beat:
          type: number
          minimum: 0.0
          title: First Word Beat
          description: Where the first word lands, in beats from the file start (room for swells/pre-roll).
          default: 0.0
        tail_beats:
          type: number
          minimum: 0.0
          title: Tail Beats
          description: Ring-out reserved at the end, inside the N bars.
          default: 0.0
        snap_end:
          type: string
          enum:
          - 'off'
          - beat
          - bar
          title: Snap End
          description: 'v0.4.1: time-manipulate the phrase so its first word starts on the downbeat and its LAST word ends
            exactly on a beat (''beat'') or bar line (''bar''), stretching/squeezing within max_stretch (R3), then let the
            tail ring; ''off'' = natural length. Speech is never truncated.'
          default: beat
        auto_tail:
          type: boolean
          title: Auto Tail
          description: Reserve room after the last word for its natural release and the chain's FX tail (reverb/delay/throws)
            when fitting; speech is never truncated (v0.4).
          default: true
        fade_in_ms:
          type: number
          minimum: 0.0
          title: Fade In Ms
          default: 2.0
        fade_out_ms:
          type: number
          minimum: 0.0
          title: Fade Out Ms
          default: 30.0
        chop:
          type: string
          enum:
          - 'off'
          - beat
          - 2beats
          - bar
          - custom
          title: Chop
          description: 'v0.8 ARRANGE: ''off'' = today''s fit. Otherwise the line is chopped at word boundaries and each piece
            starts on the grid: every beat, every 2 beats, every bar, or at chop_slots (''custom''). A piece only stretches
            (R3, within max_stretch) or squeezes when it would overlap the next; speech is never cut.'
          default: 'off'
        chop_unit:
          type: string
          enum:
          - word
          - chunk
          title: Chop Unit
          description: 'v0.8: chop per word, or per ''|'' chunk.'
          default: word
        chop_slots:
          anyOf:
          - items:
              $ref: '#/components/schemas/ChopSlot'
            type: array
          - type: 'null'
          title: Chop Slots
          description: 'v0.8: custom placements (chop=''custom'').'
      additionalProperties: false
      type: object
      title: Arrange
    BassGroove:
      properties:
        song_id:
          type: string
          title: Song Id
        start_bar:
          type: integer
          minimum: 1.0
          title: Start Bar
          description: 1-based, as SongSection.start_bar.
        bars:
          type: integer
          minimum: 1.0
          title: Bars
        bpm:
          type: number
          exclusiveMinimum: 0.0
          title: Bpm
          description: The source tempo the groove was read at.
        half_time:
          type: boolean
          title: Half Time
          default: false
        notes:
          items:
            $ref: '#/components/schemas/GrooveNote'
          type: array
          title: Notes
        wobble:
          items:
            $ref: '#/components/schemas/GrooveWobble'
          type: array
          title: Wobble
        per_beat:
          type: integer
          minimum: 1.0
          title: Per Beat
          description: Curve samples per beat.
          default: 24
        level_b64:
          type: string
          title: Level B64
          description: 'base64 of uint8, per_beat samples a beat, 0-255 for 0-1: the bounce.'
          default: ''
        growl_b64:
          type: string
          title: Growl B64
          description: 'base64 of uint8, per_beat samples a beat, 0-255 for 0-1: the growl share.'
          default: ''
      additionalProperties: false
      type: object
      required:
      - song_id
      - start_bar
      - bars
      - bpm
      title: BassGroove
      description: 'BASS DNA (v0.11.1): how a section of a song''s bass moves, re-playable on any patch at any tempo.

        GET /api/songs/{id}/bass/groove?start_bar&bars. Everything is in beats, so it re-times by rendering at another bpm.


        Maps onto MIDI for the synth: notes → note on/off + vel; midi remainder, glide_to and `bend` → pitch bend (±12 st);

        level → CC11 (the sidechain bounce); growl → CC74 (cutoff / drive); wobble → a tempo-synced LFO at `div`, phase-locked.'
    BassMacros:
      properties:
        grit:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Grit
          default: 0.5
        wobble:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Wobble
          default: 0.5
        sub:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Sub
          default: 0.5
        glide:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Glide
          default: 0.5
      additionalProperties: false
      type: object
      title: BassMacros
      description: 'The four BASS DNA knobs (v0.11.12), 0-1 each; 0.5 is the style''s default. PREPARE maps them onto the
        engine bass:

        GRIT = midbus drive and OTT depth, WOBBLE = LFO/movement depth, SUB = sub level, GLIDE = 808 glide time.'
    BassPatch:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        category:
          type: string
          enum:
          - wobble
          - reese
          - growl
          - '808'
          - riddim
