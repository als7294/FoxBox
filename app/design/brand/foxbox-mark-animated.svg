<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="FoxBox" style="color:#ff4b2b">
  <title>FoxBox</title>
  <!--
    Animated FoxBox mark for loading screens (boot, Setup, updater).
    Intro (~1 s, once): the head rises in, the jaw settles into place, the eyes open. Expo-out easing, no overshoot.
    Loop: a soft light sweep crosses the mark and the glow breathes, slowly. Nothing else moves.
    Colour follows `color` (currentColor); defaults to ember. prefers-reduced-motion shows the static mark.
  -->
  <style>
    .fb-top   { transform-box: view-box; animation: fb-rise .7s cubic-bezier(.16,1,.3,1) both; }
    .fb-jaw   { transform-box: view-box; animation: fb-settle .7s .14s cubic-bezier(.16,1,.3,1) both; }
    .fb-eye   { transform-box: fill-box; transform-origin: 50% 50%; animation: fb-open .5s .42s cubic-bezier(.16,1,.3,1) both; }
    .fb-glow  { animation: fb-breathe 4.8s 1s ease-in-out infinite; }
    .fb-sheen { animation: fb-sweep 4.8s 1.1s cubic-bezier(.45,0,.25,1) infinite both; }
    @keyframes fb-rise    { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes fb-settle  { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
    @keyframes fb-open    { from { transform: scaleY(0); } to { transform: none; } }
    @keyframes fb-breathe { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255,75,43,.22)); }
                            50% { filter: drop-shadow(0 0 18px rgba(255,75,43,.42)); } }
    @keyframes fb-sweep   { 0% { transform: translateX(-420px); } 32%, 100% { transform: translateX(560px); } }
    @media (prefers-reduced-motion: reduce) {
      .fb-top, .fb-jaw, .fb-eye, .fb-glow { animation: none; }
      .fb-sheen { display: none; }
    }
  </style>
  <defs>
    <mask id="fb-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M112 104 L196 190 L130 222 Z" fill="#000"/>
      <path d="M400 104 L316 190 L382 222 Z" fill="#000"/>
      <path class="fb-eye" d="M140 250 L248 290 L226 330 L176 306 Z" fill="#000"/>
      <path class="fb-eye" d="M372 250 L264 290 L286 330 L336 306 Z" fill="#000"/>
      <path d="M56 298 L256 410 L456 298" fill="none" stroke="#000" stroke-width="28" stroke-linejoin="miter"/>
    </mask>
    <clipPath id="fb-above"><path d="M0 0 H512 V298 H456 L256 410 L56 298 H0 Z"/></clipPath>
    <clipPath id="fb-below"><path d="M0 298 H56 L256 410 L456 298 H512 V512 H0 Z"/></clipPath>
    <clipPath id="fb-head"><path d="M96 56 L204 172 L308 172 L416 56 L452 296 L256 470 L60 296 Z"/></clipPath>
    <linearGradient id="fb-sheen-g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g class="fb-glow">
    <g class="fb-top">
      <path fill="currentColor" mask="url(#fb-cut)" clip-path="url(#fb-above)" d="M96 56 L204 172 L308 172 L416 56 L452 296 L256 470 L60 296 Z"/>
    </g>
    <g class="fb-jaw">
      <path fill="currentColor" mask="url(#fb-cut)" clip-path="url(#fb-below)" d="M96 56 L204 172 L308 172 L416 56 L452 296 L256 470 L60 296 Z"/>
    </g>
  </g>
  <g clip-path="url(#fb-head)" mask="url(#fb-cut)">
    <g transform="rotate(18 256 256)"><rect class="fb-sheen" x="0" y="-80" width="150" height="680" fill="url(#fb-sheen-g)"/></g>
  </g>
</svg>
