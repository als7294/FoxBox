<!doctype html>
<!-- The 2.0 README banner and GitHub social preview (2560×1280), in the 2.0 design's language (app/design/foxbox-2):
     warm near-black, the launch screen's glow and ensō ring, Geist, the orange accent and the fox mark.
     The hands are the app's own STRINGS film (stringsFilm.js) at t = 10.6 s, GL layer only, warmed (hands-2.0.jpg; the film harness renders it). The lockup is the FoxBox Strings wordmark (../foxbox-strings-wordmark.svg).
     Re-render from app/: node design/brand/banner/render.mjs   (needs the Geist fonts in src/renderer/src/assets/fonts) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>FoxBox 2.0 banner</title>
<style>
  @font-face { font-family: 'Geist'; font-weight: 100 900; src: url('../../../src/renderer/src/assets/fonts/geist-variable.woff2') format('woff2'); }
  @font-face { font-family: 'Geist Mono'; font-weight: 100 900; src: url('../../../src/renderer/src/assets/fonts/geist-mono-variable.woff2') format('woff2'); }
  :root { --bg: #0B0806; --ink: #F6EFE6; --ink-2: #B5A798; --accent: #F2701F; --accent-soft: #FFB27A; --fox: #FF4D2E; }
  html, body { margin: 0; width: 2560px; height: 1280px; overflow: hidden; background: var(--bg); }
  body { position: relative; font-family: 'Geist', sans-serif; color: var(--ink); }

  /* the launch screen's light: a warm glow and a thin ensō ring behind the hands */
  .glow { position: absolute; left: 1050px; top: -30px; width: 1500px; height: 1360px; border-radius: 50%;
      background: radial-gradient(closest-side, rgba(255, 77, 46, 0.26), rgba(255, 77, 46, 0.08) 55%, rgba(255, 77, 46, 0)); }
  .enso { position: absolute; left: 1340px; top: 190px; width: 920px; height: 920px; border-radius: 50%;
      box-shadow: inset 0 0 0 2px rgba(255, 77, 46, 0.32); }
  .under { position: absolute; inset: 0; background: radial-gradient(60% 50% at 80% 112%, rgba(255, 140, 50, 0.22), transparent); }

  /* the hands and strings, warmed to the 2.0 palette and faded at the edges */
  .art { position: absolute; inset: 0; overflow: hidden;
      -webkit-mask-image: radial-gradient(900px 420px at 1800px 650px, #000 70%, transparent 100%); }
  .art img { position: absolute; left: 462px; top: -101px; width: 2100px; height: 1181px; mix-blend-mode: lighten;
      filter: grayscale(1) sepia(0.9) saturate(2.4) hue-rotate(-14deg) brightness(1.08) contrast(1.06); }

  /* the words */
  .copy { position: absolute; left: 170px; top: 50%; transform: translateY(-50%); width: 980px; }
  .wm { display: block; width: 1000px; height: auto; margin-left: -6px; filter: drop-shadow(0 2px 24px rgba(0, 0, 0, 0.45)); }
  .mark { width: 104px; height: 104px; color: var(--fox); filter: drop-shadow(0 0 30px rgba(255, 77, 46, 0.5)); }
  .name { display: flex; align-items: center; gap: 36px; margin-top: 30px; }
  .word { font-weight: 800; font-size: 212px; line-height: 0.9; letter-spacing: -0.04em; }
  .ver { padding: 14px 26px 12px; border-radius: 999px; font: 600 50px/1 'Geist Mono', monospace; color: var(--bg);
      background: var(--accent); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 10px 40px -8px rgba(242, 112, 31, 0.6); }
  .line { margin-top: 40px; font-weight: 700; font-size: 74px; line-height: 1.05; letter-spacing: -0.025em; text-wrap: balance; max-width: 820px; }
  .small { margin-top: 26px; font-weight: 500; font-size: 33px; line-height: 1.45; color: var(--ink-2); max-width: 820px; }
  .modes { margin-top: 56px; font: 500 30px 'Geist Mono', monospace; letter-spacing: 0.2em; color: var(--ink); }
  .modes i { font-style: normal; color: var(--accent); padding: 0 0.35em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="under"></div>
  <div class="enso"></div>
  <div class="art"><img src="hands-2.0.jpg" alt=""></div>

  <div class="copy">
    <img class="wm" src="../foxbox-strings-wordmark.svg" alt="FoxBox Strings">
    <div class="line">An instrument for your hands.</div>
    <div class="small">Pluck strings of light between your fingers, or remix any song with hand shapes. All on your Mac.</div>
    <div class="modes">2.0<i>·</i>SAUCE<i>·</i>REMIX</div>
  </div>
</body>
</html>
